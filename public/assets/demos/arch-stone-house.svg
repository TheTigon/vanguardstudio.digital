      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <pattern id="basalt" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#475569" stroke="#1e293b" stroke-width="2" />
      <line x1="20" y1="0" x2="20" y2="12" stroke="#1e293b" stroke-width="2" />
      <line x1="0" y1="12" x2="40" y2="12" stroke="#1e293b" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#stoneBg)" />
  <!-- Sustainable Stone House & Courtyard -->
  <rect x="150" y="130" width="280" height="240" fill="url(#basalt)" stroke="#94a3b8" stroke-width="2" />
  <rect x="430" y="170" width="220" height="200" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <rect x="200" y="190" width="180" height="180" fill="#fde68a" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2" />
  <rect x="465" y="210" width="150" height="160" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2" />
  <line x1="100" y1="370" x2="700" y2="370" stroke="#34d399" stroke-width="5" />
  <text x="400" y="445" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">SÜRDÜRÜLEBİLİR BAZALT TAŞ KONUT &amp; PEYZAJ</text>
  <text x="400" y="472" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="13">280 m² · DOĞAL TAŞ İŞÇİLİĞİ &amp; PASİF İKLİMLENDİRME</text>
