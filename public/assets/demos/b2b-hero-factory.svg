<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#grid)" />
  <!-- Industrial CAD Blueprint Overlay -->
  <g stroke="#f59e0b" stroke-opacity="0.35" fill="none" stroke-width="2">
    <circle cx="900" cy="300" r="180" stroke-dasharray="10 6" />
    <circle cx="900" cy="300" r="130" />
    <circle cx="900" cy="300" r="65" stroke="#38bdf8" stroke-opacity="0.5" />
    <line x1="680" y1="300" x2="1120" y2="300" />
    <line x1="900" y1="80" x2="900" y2="520" />
    <rect x="760" y="160" width="280" height="280" rx="24" stroke="#94a3b8" stroke-opacity="0.3" />
  </g>
  <g stroke="#38bdf8" stroke-opacity="0.25" fill="none" stroke-width="1.5">
    <rect x="120" y="100" width="420" height="400" rx="16" />
    <line x1="120" y1="180" x2="540" y2="180" />
    <line x1="260" y1="100" x2="260" y2="500" />
  </g>
</svg>
